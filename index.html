<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOP Calculator</title>
    <script src="./script.js" defer></script>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <p>TOP calculator</p>
    <div class="calculator">
       <div class="screen"><div class="display"></div></div>
        <div class="buttons">
            <div class="nums">
                <div class="num1-9">
                <button class="number1">1</button>
                <button class="number2">2</button>
                <button class="number3">3</button>
                <button class="number4">4</button>
                <button class="number5">5</button>
                <button class="number6">6</button>
                <button class="number7">7</button>
                <button class="number8">8</button>
                <button class="number9">9</button>
                </div>
            <div class="zero">
                <button class="number0">0</button>
            </div>
            </div>
            <div class="op">
                <button class="operator clear">C</button>
                <button class="operator backspace"><---</button>
                <button class="operator add-op">+</button>
                <button class="operator subtract-op">-</button>
                <button class="operator multiply-op">*</button>
                <button class="operator divide-op">/</button>
                <button class="equals">=</button>
            </div>
        </div>
    </div>
</body>
</html>
